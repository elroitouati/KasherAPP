# Builds an installable Android APK in the cloud (EAS) — no computer needed.
# Run it from GitHub: Actions → "Android APK" → Run workflow.
# One-time setup: repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = standalone APK · development = dev client'
        type: choice
        default: preview
        options: [preview, development]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository secret EXPO_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Link EAS project
        run: eas init --non-interactive --force

      - name: Build APK on EAS
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --json > build.json
          cat build.json
          APK=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build.json)
          ID=$(jq -r '.[0].id' build.json)
          OWNER=$(jq -r '.[0].project.ownerAccount.name // empty' build.json)
          {
            echo "## APK מוכן"
            echo ""
            echo "- **להורדה והתקנה בטלפון:** $APK"
            [ -n "$OWNER" ] && echo "- דף הבנייה ב-Expo: https://expo.dev/accounts/$OWNER/projects/kasher-check/builds/$ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_URL=$APK"
